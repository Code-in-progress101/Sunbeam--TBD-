<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tbh's Perfect Day</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="words">
    <h1> Tbh's Perfect (24-hour) Day </h1>
    <p> What is YOUR perfect day? </p>
    </div>

    <p>Fill in your to-do list!</p>
    
    <input type="text" id="toDoListAnswerOne" placeholder="Highest Priority!">
    
    <button id="submitBtn">Done!</button>
    

    <p id="displayText"></p>

    <script>
        const inputField = document.getElementById('toDoListAnswerOne');
        const submitButton = document.getElementById('submitBtn');
        const textOutput = document.getElementById('displayText');


        submitButton.addEventListener('click', function() {

        const enteredText = inputField.value;
    
        if (enteredText.trim() !== "") {
        textOutput.textContent = "You typed: " + enteredText;
        } else {
        textOutput.textContent = "Please type something first!";
        }
        });
    </script>
</body>
</html>
