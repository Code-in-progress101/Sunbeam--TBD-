<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tbh's Perfect Day</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="words">
    <h1> Tbh's Perfect (24-hour) Day </h1>
    <h3> What is YOUR perfect day? </h3>
    <p>Hint hint: you're planning for THIS day to be better RIGHT NOW!</p>
</div>
<div id="toDoContain">
<h2>Fill in your to-do list!</h2>
    <p><input type="text" id="firstPriority" placeholder="1st"></p>
    <p><input type="text" id="secondPriority" placeholder="2nd"></p>
    <p><input type="text" id="thirdPriority" placeholder="3rd"></p>
    <p><input type="text" id="fourthPriority" placeholder="4th"></p>
    <p><input type="text" id="fifthPriority" placeholder="5th"></p>
    <p><input type="text" id="sixthPriority" placeholder="6th"></p>
    <p><input type="text" id="seventhPriority" placeholder="7th"></p>
    <p><input type="text" id="eighthPriority" placeholder="8th"></p>
    <p><input type="text" id="ninthPriority" placeholder="9th"></p>
    <p><input type="text" id="tenthPriority" placeholder="10th"></p>

    <p><button id="submitToDo">Submit To-do!</button> </p>
    </div>

    <div id="timeContain" style="display:none;">
    <h2 id="timeQuestionText">When do you want to do this?</h2>
         <p><input type="time" id="timeInput"></p>
         <p><button id="nextQuestionBtn">Next</button></p>
    <p id="resultFeedback"></p>
    </div>



<script>
    const firstToDo = document.getElementById('firstPriority');
    const secondToDo = document.getElementById('secondPriority');
    const thirdToDo = document.getElementById('thirdPriority');
    const fourthToDo = document.getElementById('fourthPriority');
    const fifthToDo = document.getElementById('fifthPriority');
    const sixthToDo = document.getElementById('sixthPriority');
    const seventhToDo = document.getElementById('seventhPriority');
    const eighthToDo = document.getElementById('eighthPriority');
    const ninthToDo = document.getElementById('ninthPriority');
    const tenthToDo = document.getElementById('tenthPriority');


    const submitButton = document.getElementById('submitToDo');
    const setupContainer = document.getElementById('toDoContain');
    const questionContainer = document.getElementById('timeContain');
    const timeQuestionText = document.getElementById('timeQuestionText');
    const timeInput = document.getElementById('timeInput');
    const nextButton = document.getElementById('nextQuestionBtn');
    const feedback = document.getElementById('resultFeedback');

    let toDoList = [];
    let schedule = [];
    let currentIndex = 0;

   submitButton.addEventListener('click', function() {
        toDoList = [
            firstToDo.value, secondToDo.value, thirdToDo.value, fourthToDo.value, fifthToDo.value,
            sixthToDo.value, seventhToDo.value, eighthToDo.value, ninthToDo.value, tenthToDo.value
        ];
    
        setupContainer.style.display = "none";
        questionContainer.style.display = "block";
        askQuestion();
    });

    function askQuestion() {
        const currentItem = toDoList[currentIndex];

        timeQuestionText.textContent = `What time do you want to: "${currentItem}"?`;
        
        timeInput.value = ""; 
    }

    nextButton.addEventListener('click', function() {
        const selectedTime = timeInput.value;
        
        if (selectedTime === "") {
            feedback.textContent = "Please pick a time!";
            return;
        }
        feedback.textContent = "";


        schedule.push({
            task: toDoList[currentIndex],
            time: selectedTime
        });

        currentIndex++;

        if (currentIndex < toDoList.length) {
            askQuestion();
        } else {
            questionContainer.style.display = "none";
            questionContainer.style.display = "block";
             timeQuestionText.textContent = "Perfect! Your schedule is locked in.";
            timeInput.style.display = "none";
            nextButton.style.display = "none";
        }
    });


</script>

   
</body>
</html>
